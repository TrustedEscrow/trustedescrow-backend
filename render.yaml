# Render Blueprint: one Postgres database plus the API and the three worker
# processes, all built from the same Dockerfile (see README "Running in Docker").
#
# Connect this repo as a Blueprint in the Render dashboard, then fill in the
# `sync: false` values it prompts for — see .env.example for what each one means
# and how to generate SERVER_ENCRYPTION_KEY. KEEPER_DRY_RUN defaults to "true" here
# so the keeper doesn't send real transactions until you deliberately flip it.
#
# FACTORY_CONTRACT_ID / ARBITRATOR_ADDRESSES / RAILS below point at the current
# testnet deployment (see trustedescrow-contract's README "Live on testnet").
# Update these together if that contract is ever redeployed.
#
# Shaped for Render's free tier: one web service plus one free Postgres. The three
# worker processes are declared but commented out at the bottom, because free plans
# run web services only.
#
# Migrations do NOT run on boot (the image's CMD is just the server), and a free
# service has no shell, no Jobs and no pre-deploy command. So after the database
# exists, run them once from a laptop against its EXTERNAL connection string:
#
#   DATABASE_URL='<external connection string>' npm run migrate
#
# Without that the API answers /healthz — which only does `select 1` — while every
# real route fails on missing tables.

envVarGroups:
  - name: trustescrow-shared
    envVars:
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: FACTORY_CONTRACT_ID
        value: CDBD65SK43MNCD5JW7HXXV3EMG2OH2UJ3FKJ2O6OEQINV7NJZOIUQMRP
      - key: ARBITRATOR_ADDRESSES
        value: GDLRZYARMBUC4HQW5MMZKV7X7C7656HZH7OI3HN55YYWM2FND64YDIBY
      - key: RAILS
        value: '[{"id":"usdc-stellar","tokenAddress":"CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA","displaySymbol":"USDC","decimals":7}]'

services:
  - type: web
    name: trustescrow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: trustescrow-shared
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: trustescrow-db
          property: connectionString
      - key: SERVER_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_DOMAIN
        sync: false
      - key: EVIDENCE_STORAGE_DIR
        value: ./storage/evidence

# --- the three workers ------------------------------------------------------
#
# Commented out, not deleted. Render's free tier runs web services only, and a
# Blueprint that declares a `type: worker` stalls asking for a paid plan, so
# leaving these active makes the whole file unappliable on free. The code for
# all three is built and tested; it just has nowhere free to run.
#
# Uncomment on a paid plan to get: list views that keep up with the chain
# (indexer), deadline emails (notifier), and automatic timeout/TTL calls
# (keeper). Nothing is trapped without them — every call they make is
# permissionless, so anyone can make it, and escrow pages read the contract
# directly. See README "Live deployment".
